<div id="not-mine-modal" class="modal-backdrop" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="not-mine-modal-title">
    <h2 id="not-mine-modal-title" data-modal-title>Why isn't this ticket yours?</h2>
    <p class="muted small">Your answer is saved to <code>learning_points.txt</code> so assignment rules can be improved.</p>
    <form method="post" action="">
      <input type="hidden" name="return_to" value="" data-return-to-input />
      <label class="full">
        Reason
        <textarea name="reason" rows="4" required minlength="8" placeholder="e.g. This is a React topic — Viharika handles frontend."></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-modal-close>Cancel</button>
        <button type="submit">Mark as Not mine</button>
      </div>
    </form>
  </div>
</div>
