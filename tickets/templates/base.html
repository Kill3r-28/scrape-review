<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}topin.tech · Tickets{% endblock %}</title>
  <link rel="icon" href="/static/topin-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css?v=day-update-1" />
  {% if auto_refresh_seconds %}
  <meta http-equiv="refresh" content="{{ auto_refresh_seconds }}" />
  {% endif %}
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      {% block header_back %}{% endblock %}
      <div class="brand">
        <a href="/" class="brand-link">
          <img src="/static/topin-icon.svg" alt="" class="topin-icon" width="28" height="28" />
          <span class="brand-wordmark">topin<span class="brand-dottech">.tech</span></span>
        </a>
      </div>
    </div>
    <div class="topbar-right">
      {% if user %}
      <a href="/">Tickets</a>
      {% if is_admin %}
      <a href="/assignments">Assignments</a>
      {% endif %}
      <span class="muted">{{ user.display_name }}</span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="btn-ghost">Log out</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
  {% if is_admin %}
  <script src="/static/update-progress.js?v=day-update-1"></script>
  {% endif %}
</body>
</html>
