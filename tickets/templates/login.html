<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · topin.tech</title>
  <link rel="icon" href="/static/topin-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <a href="/" class="brand-link login-brand">
      <img src="/static/topin-icon.svg" alt="" class="topin-icon" width="32" height="32" />
      <span class="brand-wordmark">topin<span class="brand-dottech">.tech</span></span>
    </a>
    <h1>Ticket resolution</h1>
    <p class="muted">Sign in to view and resolve student report tickets.</p>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login" class="login-form">
      <label>
        Username
        <input name="username" autocomplete="username" required autofocus />
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn-gradient">Sign in</button>
    </form>
  </main>
</body>
</html>
